name: Build APK + OpenCode Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      scan_only:
        description: 'Run OpenCode stub scan only (skip APK build)'
        required: false
        default: false
        type: boolean

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.7'

jobs:
  opencode-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      stubs_found: ${{ steps.scan.outputs.stubs_found }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install requests --quiet
      - name: Detect Stub Code
        id: scan
        run: |
          python scripts/detect-stubs.py --src=app/src/main/java --format=json --output=stubs-report.json --severity=all
          STUB_COUNT=$(python -c "import json; d=json.load(open('stubs-report.json')); print(d['meta']['stubs_found'])" 2>/dev/null || echo "0")
          echo "stubs_found=$STUB_COUNT" >> $GITHUB_OUTPUT
          echo "Files scanned: $(python -c "import json; d=json.load(open('stubs-report.json')); print(d['meta']['files_scanned'])")"
          echo "Stubs found: $STUB_COUNT"
      - uses: actions/upload-artifact@v4
        if: steps.scan.outputs.stubs_found != '0'
        with:
          name: stubs-report-raw
          path: stubs-report.json
      - name: OpenCode Auto-Complete Stubs
        if: steps.scan.outputs.stubs_found != '0'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Running OpenCode completion engine..."
          python scripts/complete-stubs.py stubs-report.json
      - uses: actions/upload-artifact@v4
        if: steps.scan.outputs.stubs_found != '0'
        with:
          name: stubs-completed
          path: stubs-completed/
      - name: Create Pull Request with Completions
        if: steps.scan.outputs.stubs_found != '0' && github.event_name == 'push'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🤖 OpenCode: Auto-complete stub implementations"
          title: "🤖 OpenCode: Auto-complete ${{ steps.scan.outputs.stubs_found }} stub(s)"
          body: |
            This PR was automatically generated by the OpenCode CI pipeline.
            **Scan Summary:**
            - Stubs found: ${{ steps.scan.outputs.stubs_found }}
            - Auto-applied: see commit diff
            - Needs review: check `stubs-completed/` artifact
            Please review all changes before merging.
          branch: opencode/auto-complete-${{ github.run_id }}
          delete-branch: true

  build-apk:
    runs-on: ubuntu-latest
    needs: opencode-scan
    if: ${{ !inputs.scan_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build Release APK
        run: gradle assembleRelease --no-daemon
      - name: Sign APK
        if: ${{ env.SIGNING_KEYSTORE != '' }}
        continue-on-error: true
        uses: r0adkll/sign-android-release@v1
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEYSTORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: bmw-e60-coder-pro-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: app/build/reports/
