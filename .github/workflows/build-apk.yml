name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bmw-e60-coder-pro-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install requests --quiet
      - name: Detect Stub Code
        id: scan
        run: |
          python scripts/detect-stubs.py --src=app/src/main/java --format=json --output=stubs-report.json --severity=all
          STUB_COUNT=$(python -c "import json; d=json.load(open('stubs-report.json')); print(d['meta']['stubs_found'])" 2>/dev/null || echo "0")
          echo "stubs_found=$STUB_COUNT" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: steps.scan.outputs.stubs_found != '0'
        with:
          name: stubs-report-raw
          path: stubs-report.json
      - name: Commit stub fixes
        if: steps.scan.outputs.stubs_found != '0'
        
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "🤖 Auto-fix stubs [ci skip]" && git push)

  build-apk:
    runs-on: ubuntu-latest
    needs: opencode-scan
    if: ${{ !inputs.scan_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Release APK (Attempt 1)
        id: build1
      
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > /tmp/release.keystore
          gradle assembleRelease --no-daemon 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}

      - name: Build Release APK (Attempt 2)
        id: build2
        if: steps.build1.outcome == 'failure' && inputs.fix_mode == true
        
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > /tmp/release.keystore
          gradle assembleRelease --no-daemon 2>&1 | tee build-log-2.txt
          exit ${PIPESTATUS[0]}

      - name: Build Release APK (Attempt 3 - Final)
        id: build3
        if: steps.build2.outcome == 'failure' && inputs.fix_mode == true
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > /tmp/release.keystore
          gradle assembleRelease --no-daemon

      - name: Check Build Status
        if: steps.build1.outcome == 'failure' && steps.build2.outcome == 'failure' && steps.build3.outcome == 'failure'
        run: |
          echo "ERROR: All build attempts failed."
          cat build-log.txt
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: bmw-e60-coder-pro-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
